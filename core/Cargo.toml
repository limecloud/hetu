[package]
name = "hetu-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
uuid.workspace = true
time.workspace = true
jsonschema.workspace = true
rustix.workspace = true
pulldown-cmark.workspace = true
aho-corasick.workspace = true
url = "2.5"
base64 = "=0.22.1"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
git2 = { version = "=0.20.4", default-features = false, features = ["vendored-libgit2"] }
zip = { version = "=9.4.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "=0.39.2"
pdf-writer = "=0.14.0"
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }
subsetter = { version = "=0.2.3", default-features = false }

[dev-dependencies]
tempfile = "3.25"

[lints]
workspace = true
