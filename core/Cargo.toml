[package]
name = "hetu-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
uuid.workspace = true
time.workspace = true
jsonschema.workspace = true
pulldown-cmark.workspace = true
aho-corasick.workspace = true
url = "2.5"
base64.workspace = true
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
git2 = { version = "=0.20.4", default-features = false, features = ["vendored-libgit2"] }
zip = { version = "=9.4.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "=0.39.2"
pdf-writer = "=0.14.0"
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }
subsetter = { version = "=0.2.3", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }

[dev-dependencies]
tempfile = "3.25"

[build-dependencies]
sha2.workspace = true

[lints]
workspace = true

[target."cfg(unix)".dependencies]
rustix.workspace = true

[target."cfg(windows)".dependencies]
cap-fs-ext = "=3.4.6"
cap-std = "=3.4.6"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
