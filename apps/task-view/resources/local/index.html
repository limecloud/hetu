:root[data-appearance=light], :root[data-theme=light] { color-scheme: light; }
:root[data-appearance=dark], :root[data-theme=dark] { color-scheme: dark; }

a { color: var(--jade); }
::selection { background: var(--jade-4); color: var(--ink); }

:root{font:14px/1.6 system-ui,sans-serif}body{margin:0;background:var(--page);color:var(--ink)}main{max-width:800px;margin:8vh auto;padding:24px}h1{font-size:20px}button{font:inherit;padding:8px 16px;border:.5px solid var(--line);border-radius:6px;background:var(--action);color:var(--action-ink);cursor:pointer}button:hover{background:var(--action-hover)}button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}button:disabled{opacity:.55;cursor:default}code{font:600 20px/2 ui-monospace,monospace;letter-spacing:.15em}iframe{display:block;border:0;width:100%;min-height:100vh}body.paired main{max-width:none;margin:0;padding:0}body.paired #pairing{display:none}.note{color:var(--muted);font-size:12px}#connection{padding:8px 20px;margin:0}</style></head>
