[package]
name = "hetu-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hetu-core = { path = "../../core" }
serde.workspace = true
serde_json.workspace = true
jsonschema.workspace = true
sha2.workspace = true
form_urlencoded = "1.2"
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tempfile = "3.25"
rmcp = { version = "=3.9.0", default-features = false, features = ["client"] }
tokio = { version = "1.49", features = ["process"] }

[lints]
workspace = true
