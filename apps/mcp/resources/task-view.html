:root[data-appearance=light], :root[data-theme=light] { color-scheme: light; }
:root[data-appearance=dark], :root[data-theme=dark] { color-scheme: dark; }

a { color: var(--jade); }
::selection { background: var(--jade-4); color: var(--ink); }
/* 共享Radix语义色；20/14/12px，审核内容优先。 */
:root { font: 14px/1.65 var(--font-sans, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif); color: var(--ink); background: var(--page); }
* { box-sizing: border-box; }
body { margin: 0; }
main { padding: 20px; max-width: 1120px; margin: auto; }
h1 { font-size: 20px; line-height: 1.4; margin: 0; }
h2, h3 { font-size: 14px; margin: 0; }
p { margin: 6px 0 14px; }
button, input, textarea { font: inherit; }
button { padding: 7px 13px; border: .5px solid var(--line); border-radius: 6px; background: var(--paper); color: inherit; cursor: pointer; }
button:hover { background: var(--hover); }
button:disabled { opacity: .55; cursor: default; }
button.primary { background: var(--action); color: var(--action-ink); border-color: transparent; }
button.primary:hover { background: var(--action-hover); }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.top, .actions, .candidate-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top { margin-bottom: 14px; }
.muted, .meta, .boundary { color: var(--muted); }
.meta, .boundary { font-size: 12px; overflow-wrap: anywhere; }
.brief { white-space: pre-wrap; margin: 16px 0; }
.candidates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 16px 0; }
.candidate { border: .5px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.candidate:has(input:checked) { border-color: var(--jade-8); background: var(--jade-2); }
.candidate-heading { align-items: flex-start; justify-content: flex-start; margin-bottom: 10px; }
.candidate-heading input { width: 16px; height: 16px; accent-color: var(--action); flex: none; margin-top: 3px; }
.candidate-heading label { cursor: pointer; min-width: 0; overflow-wrap: anywhere; }
.content { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 460px; overflow: auto; margin: 0; font: inherit; }
.cover { display: block; max-width: 100%; width: auto; max-height: 420px; height: auto; object-fit: contain; margin: auto; }
.patch { border-top: .5px solid var(--line); margin-top: 10px; padding-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.patch del, .patch ins { display: block; text-decoration: none; padding: 6px; }
.patch del { background: var(--danger); color: var(--danger-ink); }
.patch ins { background: var(--jade-soft); color: var(--jade); }
textarea { display: block; resize: vertical; min-height: 100px; width: 100%; margin: 7px 0 4px; padding: 10px; border: .5px solid var(--line); border-radius: 6px; color: inherit; background: var(--page); }
.comment-label { display: block; margin-top: 16px; }
.actions { justify-content: flex-start; flex-wrap: wrap; margin-top: 14px; }
.boundary { margin-top: 8px; }
.status { min-height: 25px; margin-top: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.status[data-error=true] { color: var(--danger-ink); }
.empty { padding: 25px 0; text-align: center; }
.unavailable { padding: 12px 0; color: var(--warning-ink); }
.detail { margin: 12px 0; }
summary { cursor: pointer; }
.detail pre { font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 280px; overflow: auto; }
