name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron:
    name: Electron macOS arm64 tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "25.0.0"
          cache: npm
      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Install locked dependencies
        run: npm ci
      - name: Verify release versions and shared resources
        run: |
          node "tools/verify-release.mjs"
          python3 "tools/verify-localization.py"
          python3 "tools/sync-capability-map.py" --check
          python3 "tools/sync-writing-methods.py" --check
          python3 -m unittest discover -s tests/tooling -v
          node --test tests/release/*.test.mjs
          npm run check --workspace @hetu/task-view
      - name: Test Rust workspace
        run: cargo test --locked --workspace --jobs 2 -- --test-threads=2
      - name: Test plugins and Electron workbench
        run: |
          npm run test:plugins
          npm run test:e2e --workspace @hetu/desktop -- --grep-invert '独立开发应用'
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-test-results
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: macOS optimized Core tests
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal
      - name: Test optimized collaboration
        env:
          RUST_BACKTRACE: "1"
          RUSTC_BOOTSTRAP: "1"
          RUSTFLAGS: "-Zsanitizer=address"
        run: |
          if cargo test --locked --release --target aarch64-apple-darwin -p hetu-core --test collaboration; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          binaries = [path for path in Path('target/aarch64-apple-darwin/release/deps').glob('collaboration-*')
                      if path.is_file() and not path.suffix]
          if len(binaries) == 1:
              subprocess.run(['lldb', '--batch', '-o', 'run', '-o', 'thread backtrace all',
                              '--', str(binaries[0]), '--nocapture'], check=False)
          PY
          exit 1

  web:
    name: Website and task view tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
      - name: Install locked Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal
      - name: Install dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build website
        run: npm run build
      - name: Test website and task view
        run: |
          npm run test:cli
          npm run test --workspace @hetu/website
          xvfb-run -a npm run test:task-view
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            apps/website/test-results/
            apps/website/playwright-report/
            build/task-view/test-results/
          retention-days: 7
